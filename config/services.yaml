# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  locale: "en"
  user_images_subdirectory: "/uploads/profile"
  mapitem_images_subdirectory: "/uploads/map"
  # Shared secret for emich.edu server-to-server calls (see App\Security\ExternalApiToken).
  # Set EXTERNAL_API_TOKEN on each server; empty means no request has a valid token.
  env(EXTERNAL_API_TOKEN): ''
  # "log" accepts legacy callers and logs a warning; "enforce" requires the token.
  env(EXTERNAL_API_TOKEN_MODE): 'log'

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"

  Symfony\Component\Ldap\Ldap:
    arguments: ['@Symfony\Component\Ldap\Adapter\ExtLdap\Adapter']
    tags:
      - ldap
  Symfony\Component\Ldap\Adapter\ExtLdap\Adapter:
    arguments:
      - host: ad.emich.edu
        port: 389
        encryption: none
        options:
          protocol_version: 3
          referrals: false

  App\Controller\Api\CrimeLog\CrimeLogController:
    arguments:
      $logger: "@monolog.logger.crime_log"
