# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  locale: "en"
  user_images_subdirectory: "/uploads/profile"
  mapitem_images_subdirectory: "/uploads/map"
  # Active Directory connection. Defaults match the previous hard-coded values.
  # Switch LDAP_ENCRYPTION to "tls" (StartTLS on 389) or "ssl" (with LDAP_PORT=636)
  # once AD confirms which it offers; the AD CA must be trusted on the server.
  env(LDAP_HOST): 'ad.emich.edu'
  env(LDAP_PORT): '389'
  env(LDAP_ENCRYPTION): 'none'
  # Comma-separated IPs/CIDRs of reverse proxies in front of the app (empty = none).
  env(TRUSTED_PROXIES): ''

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    bind:
      # This links your variable name directly to the service ID
      $externalRedirectsLimiter: '@limiter.external_redirects'

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"

  Symfony\Component\Ldap\Ldap:
    arguments: ['@Symfony\Component\Ldap\Adapter\ExtLdap\Adapter']
    tags:
      - ldap
  Symfony\Component\Ldap\Adapter\ExtLdap\Adapter:
    arguments:
      - host: '%env(LDAP_HOST)%'
        port: '%env(int:LDAP_PORT)%'
        encryption: '%env(LDAP_ENCRYPTION)%'
        options:
          protocol_version: 3
          referrals: false

  # Rate limiting for API calls
  ratelimit_subscriber:
    class: App\EventSubscriber\RateLimitSubscriber
    tags:
      - { name: kernel.request, connection: default }

  App\Controller\Api\CrimeLog\CrimeLogController:
    arguments:
      $logger: "@monolog.logger.crime_log"
