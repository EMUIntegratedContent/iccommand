# Test environment - form login without UserChecker (for PHPUnit)
when@test:
  security:
    firewalls:
      main:
        lazy: true
        # At most 5 failed logins per username+IP (and 25 per IP) every 15 minutes.
        # Relies on real client IPs: set TRUSTED_PROXIES if a proxy fronts the app.
        login_throttling:
          max_attempts: 5
          interval: '15 minutes'
        form_login:
          provider: users
          login_path: app_login
          check_path: app_login
          enable_csrf: true
        logout:
          path: /logout
          enable_csrf: true
