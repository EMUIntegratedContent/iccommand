security:
  providers:
    users:
      entity:
        class: 'App\Entity\User'
        property: email

  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

  access_control:
    # --- API ---------------------------------------------------------------
    # First match wins. Public API routes are listed explicitly, then every
    # other /api route requires a logged-in user as a floor. Individual
    # actions still check their module role with #[IsGranted].
    #
    # External API: read-only feeds that must be publicly accessible.
    - { path: ^/api/external, roles: PUBLIC_ACCESS }
    # emich.edu 404 page (server-side): redirect lookup and visit counters.
    # The write routes are protected by the shared API token instead of a login.
    - { path: ^/api/redirects/external/, roles: PUBLIC_ACCESS }
    - { path: ^/api/uncaughts/external/, roles: PUBLIC_ACCESS }
    # Building names are read by emich.edu. Directory search for emich.edu is
    # the public /api/external/directory/search; /api/directory/search is internal.
    - { path: ^/api/directory/bldgnames$, methods: [GET], roles: PUBLIC_ACCESS }
    # Emergency banner shown on emich.edu pages.
    - { path: ^/api/emergency/banner$, methods: [GET], roles: PUBLIC_ACCESS }
    # Everything else under /api requires login.
    - { path: ^/api, roles: ROLE_USER }
    # --- Pages -------------------------------------------------------------
    - { path: ^/directory, roles: [ROLE_DEPARTMENTS_VIEW, ROLE_GLOBAL_ADMIN] }
    - { path: ^/photorequests, roles: [ROLE_PHOTO_VIEW, ROLE_GLOBAL_ADMIN] }
    - { path: ^/emergency, roles: [ROLE_EMERGENCY_EDIT, ROLE_GLOBAL_ADMIN] }
    - { path: ^/crimelog, roles: [ROLE_CRIMELOG_USER, ROLE_GLOBAL_ADMIN] }
    - { path: ^/programs, roles: [ROLE_PROGRAMS_VIEW, ROLE_GLOBAL_ADMIN] }
    - { path: ^/map, roles: [ROLE_MAP_VIEW, ROLE_GLOBAL_ADMIN] }
    - { path: ^/redirects, roles: [ROLE_REDIRECT_USER, ROLE_GLOBAL_ADMIN] }
    - { path: ^/cas, roles: [ROLE_CAS_VIEW, ROLE_GLOBAL_ADMIN] }
    - { path: ^/social-media, roles: [ROLE_SOCIAL_USER, ROLE_GLOBAL_ADMIN] }
    - { path: ^/scholarships, roles: [ROLE_SCHOLARSHIP_VIEW, ROLE_GLOBAL_ADMIN] }
    - { path: ^/register, role: ROLE_GLOBAL_ADMIN }
    - { path: ^/resetting, role: ROLE_GLOBAL_ADMIN }
    - { path: ^/admin, role: ROLE_GLOBAL_ADMIN }
    - { path: ^/applinks, role: ROLE_USER }
    - { path: ^/profile, role: ROLE_USER }
    - { path: ^/$, role: ROLE_USER }

  role_hierarchy:
    # Global
    ROLE_GLOBAL_ADMIN: ROLE_USER
    ROLE_GLOBAL_ADMIN_SUPER: ROLE_GLOBAL_ADMIN
    # Map Application
    ROLE_MAP_VIEW: ROLE_USER
    ROLE_MAP_CREATE: ROLE_MAP_VIEW
    ROLE_MAP_EDIT: ROLE_MAP_CREATE
    ROLE_MAP_DELETE: ROLE_MAP_EDIT
    ROLE_MAP_IMAGE_UPLOAD: [ROLE_MAP_VIEW, ROLE_MAP_EDIT]
    ROLE_MAP_ADMIN: [ROLE_MAP_DELETE, ROLE_MAP_IMAGE_UPLOAD]
    # Redirect Application
    ROLE_REDIRECT_USER: ROLE_USER
    ROLE_REDIRECT_ADMIN: ROLE_REDIRECT_USER
    # Catalog Programs
    ROLE_PROGRAMS_VIEW: ROLE_USER
    ROLE_PROGRAMS_CREATE: ROLE_PROGRAMS_VIEW
    ROLE_PROGRAMS_EDIT: ROLE_PROGRAMS_CREATE
    ROLE_PROGRAMS_DELETE: ROLE_PROGRAMS_EDIT
    ROLE_PROGRAMS_ADMIN: ROLE_PROGRAMS_DELETE
    # Crime Log
    ROLE_CRIMELOG_USER: ROLE_USER
    ROLE_CRIMELOG_ADMIN: ROLE_CRIMELOG_USER
    # Department Directory
    ROLE_DEPARTMENTS_VIEW: ROLE_USER
    ROLE_DEPARTMENTS_CREATE: ROLE_DEPARTMENTS_VIEW
    ROLE_DEPARTMENTS_EDIT: ROLE_DEPARTMENTS_CREATE
    ROLE_DEPARTMENTS_DELETE: ROLE_DEPARTMENTS_EDIT
    ROLE_DEPARTMENTS_ADMIN: ROLE_DEPARTMENTS_DELETE
    # Photo Request
    ROLE_PHOTO_VIEW: ROLE_USER
    ROLE_PHOTO_PHOTOG: ROLE_PHOTO_VIEW
    ROLE_PHOTO_CREATE: ROLE_PHOTO_VIEW
    ROLE_PHOTO_EDIT: ROLE_PHOTO_CREATE
    ROLE_PHOTO_DELETE: ROLE_PHOTO_EDIT
    ROLE_PHOTO_ADMIN: ROLE_PHOTO_DELETE
    # Emergency
    ROLE_EMERGENCY_EDIT: ROLE_USER
    ROLE_EMERGENCY_ADMIN: ROLE_EMERGENCY_EDIT
    # CAS App Links
    ROLE_CAS_VIEW: ROLE_USER
    ROLE_CAS_EDIT: ROLE_CAS_VIEW
    ROLE_CAS_ADMIN: ROLE_CAS_EDIT
    # Social Media Directory
    ROLE_SOCIAL_USER: ROLE_USER
    ROLE_SOCIAL_ADMIN: ROLE_SOCIAL_USER
    # Scholarships
    ROLE_SCHOLARSHIP_VIEW: ROLE_USER
    ROLE_SCHOLARSHIP_CREATE: ROLE_SCHOLARSHIP_VIEW
    ROLE_SCHOLARSHIP_EDIT: ROLE_SCHOLARSHIP_CREATE
    ROLE_SCHOLARSHIP_DELETE: ROLE_SCHOLARSHIP_EDIT
    ROLE_SCHOLARSHIP_ADMIN: ROLE_SCHOLARSHIP_DELETE

# Local development (Docker) - form login with UserChecker
when@dev:
  security:
    firewalls:
      dev:
        pattern: ^/(_(profiler|wdt)|css|images|js)/
        security: false
      main:
        pattern: ^/
        user_checker: App\Security\UserChecker
        lazy: true
        # At most 5 failed logins per username+IP (and 25 per IP) every 15 minutes.
        # Relies on real client IPs: set TRUSTED_PROXIES if a proxy fronts the app.
        login_throttling:
          max_attempts: 5
          interval: '15 minutes'
        form_login:
          provider: users
          login_path: app_login
          check_path: app_login
          enable_csrf: true
        logout:
          path: /logout
          enable_csrf: true

# Staging server - LDAP auth
when@staging:
  security:
    firewalls:
      dev:
        pattern: ^/(_(profiler|wdt)|css|images|js)/
        security: false
      main:
        # Blocks accounts that an admin has disabled.
        user_checker: App\Security\UserChecker
        lazy: true
        # At most 5 failed logins per username+IP (and 25 per IP) every 15 minutes.
        # Relies on real client IPs: set TRUSTED_PROXIES if a proxy fronts the app.
        login_throttling:
          max_attempts: 5
          interval: '15 minutes'
        provider: users
        form_login_ldap:
          login_path: app_login
          check_path: app_login
          enable_csrf: true
          service: Symfony\Component\Ldap\Ldap
          dn_string: "cn={user_identifier},cn=users,dc=ad,dc=emich,dc=edu"
        logout:
          path: /logout
          enable_csrf: true

